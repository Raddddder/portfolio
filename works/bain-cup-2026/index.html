<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #0a0a0a;
  --white: #f8f7f3;
  --gray: #8a8a8a;
  --light: #e8e6df;
  --accent: #d4000f;
  --serif: 'Noto Serif SC', serif;
  --sans: 'Noto Sans SC', sans-serif;
  --mono: 'DM Mono', monospace;
}
body {
  background: var(--white);
  color: var(--black);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 300;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
header {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  border-bottom: 1px solid var(--black);
  background: var(--white);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
}
.mark {
  width: 32px;
  height: 28px;
  display: grid;
  place-items: center;
  background: var(--black);
  color: var(--white);
  letter-spacing: 0;
}
.back {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gray);
}
.hero {
  display: grid;
  grid-template-columns: minmax(320px, 0.85fr) 1.15fr;
  min-height: calc(100vh - 56px);
  border-bottom: 1px solid var(--black);
}
.intro {
  padding: 56px 48px;
  border-right: 1px solid var(--black);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 48px;
}
.kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 20px;
}
h1 {
  font-family: var(--serif);
  font-size: clamp(30px, 5vw, 62px);
  font-weight: 300;
  line-height: 1.15;
  margin-bottom: 22px;
}
.summary {
  max-width: 520px;
  color: var(--gray);
}
.meta {
  display: grid;
  gap: 14px;
  border-top: 1px solid var(--light);
  padding-top: 24px;
}
.meta-row {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.meta-row span:first-child { color: var(--gray); }
.cover {
  min-height: 420px;
  background: var(--light);
}
.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.viewer {
  padding: 40px;
  border-bottom: 1px solid var(--black);
}
.viewer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}
.viewer-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray);
}
.viewer-link {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
}
.deck-pages {
  display: grid;
  gap: 24px;
}
.deck-page {
  background: white;
  border: 1px solid var(--black);
}
.deck-page img {
  width: 100%;
  display: block;
}
@media (max-width: 900px) {
  header { padding: 0 20px; }
  .hero { grid-template-columns: 1fr; }
  .intro { border-right: none; border-bottom: 1px solid var(--black); padding: 40px 24px; }
  .cover { min-height: 240px; }
  .viewer { padding: 28px 20px; }
  .viewer-head { align-items: flex-start; flex-direction: column; gap: 10px; }
  .deck-pages { gap: 16px; }
}
</style>
</head>
